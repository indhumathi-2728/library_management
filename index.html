
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bright Books</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, Helvetica, sans-serif;
  color: #202a3a;
  min-height: 100vh;
  background: linear-gradient(140deg,
    #e4f5e6 0%, #fffbc0 48%, #ffedf0 100%);
}

.hero {
  background: linear-gradient(110deg, #2465ed, #079fe8);
  color: white;
  padding: 44px 5%;
  min-height: 225px;
  display: flex;
  align-items: center;
  gap: 24px;
  border-radius: 0 0 42px 42px;
}

.logo {
  width: 106px;
  height: 106px;
  flex-shrink: 0;
  background: #ffffff25;
  border-radius: 30px;
  display: grid;
  place-items: center;
  font-size: 54px;
}

.hero h1 {
  font-size: clamp(30px, 5vw, 48px);
  margin-bottom: 8px;
}

.hero p {
  font-size: clamp(17px, 2.8vw, 25px);
  line-height: 1.5;
  color: #e6f2ff;
  max-width: 560px;
}

main {
  max-width: 900px;
  padding: 0 24px;
  margin: 24px auto 60px;
}

nav {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-bottom: 46px;
}

nav button {
  background: white;
  color: #344052;
  border: none;
  border-radius: 20px;
  min-height: 116px;
  padding: 12px 4px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 8px 20px #273b5110;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 9px;
}

nav button .ico {
  font-size: 34px;
  font-weight: normal;
}

nav button.active {
  background: linear-gradient(140deg, #2469ef, #079ce9);
  color: white;
  box-shadow: 0 0 0 3px #39a5ff80;
}

h2 {
  font-size: clamp(27px, 4vw, 38px);
  margin-bottom: 38px;
}

.book-list {
  display: grid;
  gap: 24px;
}

.book {
  background: white;
  border-top: 7px solid #2863e9;
  border-radius: 28px;
  padding: 32px 30px 30px;
  box-shadow: 0 12px 24px #34465a12;
}

.book-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
}

.book h3 {
  font-size: clamp(23px, 3.8vw, 31px);
  line-height: 1.25;
  margin-bottom: 20px;
  overflow-wrap: anywhere;
}

.author {
  font-size: 22px;
  color: #596474;
  margin-bottom: 24px;
}

.delete {
  border: none;
  background: transparent;
  color: #cbd2dc;
  font-size: 28px;
  cursor: pointer;
}

.stats {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  margin-bottom: 20px;
}

.pill {
  padding: 9px 18px;
  border-radius: 999px;
  background: #f0f3f8;
  color: #374255;
  font-size: 18px;
  font-weight: bold;
}

.available {
  background: #d9f9e7;
  color: #168c49;
}

.actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}

.action {
  border: none;
  border-radius: 18px;
  min-height: 68px;
  padding: 12px;
  color: white;
  font-size: 21px;
  font-weight: bold;
  cursor: pointer;
}

.issue {
  background: #18a34a;
}

.return {
  background: #d9232e;
}

.action:disabled {
  background: #e9a2a5;
  cursor: not-allowed;
}

.issued-card {
  border-top: none;
  border-left: 7px solid #f0a000;
  padding: 32px 28px;
}

.issued-card h3 {
  margin-bottom: 10px;
}

.issued-card .author {
  margin-bottom: 14px;
}

.issued-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
}

.borrower {
  display: inline-block;
  background: #fff3c4;
  color: #855020;
  padding: 8px 15px;
  border-radius: 999px;
  font-size: 19px;
  font-weight: bold;
}

.issued-card .action {
  min-height: 58px;
  white-space: nowrap;
}

.panel {
  background: white;
  padding: 28px;
  border-radius: 26px;
  box-shadow: 0 10px 24px #34465a12;
}

.panel h3 {
  margin-bottom: 22px;
  font-size: 25px;
}

.form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px;
}

.field.full {
  grid-column: 1 / -1;
}

label {
  display: block;
  margin-bottom: 8px;
  color: #4c5869;
  font-weight: bold;
}

input {
  width: 100%;
  padding: 14px;
  border: 1px solid #d7deea;
  border-radius: 12px;
  font-size: 17px;
  outline-color: #1677f9;
}

.submit {
  margin-top: 20px;
  padding: 15px 22px;
  background: #1677f9;
  color: white;
  border: none;
  border-radius: 14px;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
}

.search-box {
  margin: -18px 0 28px;
}

.search-box input {
  background: white;
  padding: 16px;
  font-size: 18px;
}

.empty {
  padding: 35px 20px;
  background: #ffffffb8;
  border-radius: 24px;
  text-align: center;
  color: #596474;
  font-size: 18px;
}

.toast {
  display: none;
  position: fixed;
  z-index: 10;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  background: #202a3a;
  color: white;
  padding: 14px 20px;
  border-radius: 12px;
  max-width: 90%;
}

@media (max-width: 560px) {
  .hero {
    padding: 44px 5% 46px;
    gap: 18px;
  }

  .logo {
    width: 106px;
    height: 106px;
    flex-basis: 106px;
  }

  .hero h1 {
    font-size: 34px;
  }

  .hero p {
    font-size: 20px;
  }

  nav {
    gap: 12px;
  }

  nav button {
    min-height: 116px;
    border-radius: 19px;
  }

  .issued-row {
    align-items: center;
  }

  .issued-card .action {
    font-size: 18px;
  }
}

@media (max-width: 390px) {
  main {
    padding: 0 15px;
  }

  .hero {
    gap: 12px;
  }

  .logo {
    width: 78px;
    height: 78px;
    flex-basis: 78px;
    font-size: 40px;
  }

  .hero h1 {
    font-size: 29px;
  }

  .hero p {
    font-size: 16px;
  }

  nav {
    gap: 7px;
  }

  nav button {
    min-height: 96px;
    font-size: 14px;
  }

  nav button .ico {
    font-size: 27px;
  }

  .book {
    padding: 24px 18px;
  }

  .actions {
    gap: 8px;
  }

  .action {
    min-height: 56px;
    font-size: 17px;
  }

  .issued-card {
    padding: 24px 16px;
  }

  .issued-row {
    flex-wrap: wrap;
  }

  .form-grid {
    grid-template-columns: 1fr;
  }

  .field.full {
    grid-column: auto;
  }
}
</style>
</head>

<body>

<header class="hero">
  <div class="logo">📚</div>
  <div>
    <h1>Bright Books</h1>
    <p>Your colorful little library, always in your pocket</p>
  </div>
</header>

<main>
  <nav>
    <button class="active" data-view="all">
      <span class="ico">☷</span>
      <span>All Books</span>
    </button>

    <button data-view="add">
      <span class="ico">⊕</span>
      <span>Add Book</span>
    </button>

    <button data-view="search">
      <span class="ico">⌕</span>
      <span>Search</span>
    </button>

    <button data-view="issued">
      <span class="ico">▣</span>
      <span>Issued</span>
    </button>
  </nav>

  <section id="content"></section>
</main>

<div class="toast" id="toast" role="status"></div>

<script>
const defaultBooks = [
  {
    id: 1,
    title: "Python Programming",
    author: "John Smith",
    total: 16,
    issued: []
  },
  {
    id: 2,
    title: "Romeo Juliet",
    author: "William Shakespeare",
    total: 25,
    issued: [
      { name: "Gracy", date: "2026-10-25" }
    ]
  },
  {
    id: 3,
    title: "Harry potter and the sorcerer's stone",
    author: "J.K.Rowling",
    total: 16,
    issued: []
  },
  {
    id: 4,
    title: "The Great Gatsby",
    author: "F. Scott Fitzgerald",
    total: 12,
    issued: []
  }
];

let books;

try {
  const saved = localStorage.getItem("brightBooksData");
  books = saved ? JSON.parse(saved) : defaultBooks;
  if (!Array.isArray(books)) books = defaultBooks;
} catch {
  books = defaultBooks;
}

let view = "all";
let searchQuery = "";

const content = document.getElementById("content");

function saveBooks() {
  try {
    localStorage.setItem("brightBooksData", JSON.stringify(books));
  } catch {
    showToast("Could not save changes in this browser.");
  }
}

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);
}

function showToast(message) {
  const toast = document.getElementById("toast");
  toast.textContent = message;
  toast.style.display = "block";

  clearTimeout(showToast.timer);

  showToast.timer = setTimeout(() => {
    toast.style.display = "none";
  }, 2200);
}

document.querySelectorAll("nav button").forEach(button => {
  button.addEventListener("click", () => {
    view = button.dataset.view;

    document.querySelectorAll("nav button").forEach(item => {
      item.classList.toggle("active", item === button);
    });

    render();
  });
});

function bookCard(book) {
  const available = book.total - book.issued.length;

  return `
    <article class="book">
      <div class="book-top">
        <div>
          <h3>${escapeHTML(book.title)}</h3>
          <p class="author">by ${escapeHTML(book.author)}</p>
        </div>

        <button class="delete"
          title="Delete book"
          aria-label="Delete book"
          onclick="deleteBook(${book.id})">♧</button>
      </div>

      <div class="stats">
        <span class="pill">${book.total} total</span>
        <span class="pill available">${available} available</span>
      </div>

      <div class="actions">
        <button class="action issue"
          onclick="issueBook(${book.id})"
          ${available <= 0 ? "disabled" : ""}>
          ↗ &nbsp;Issue
        </button>

        <button class="action return"
          onclick="returnBook(${book.id})"
          ${book.issued.length === 0 ? "disabled" : ""}>
          ↙ &nbsp;Return
        </button>
      </div>
    </article>
  `;
}

function issuedCard(book, borrower, index) {
  return `
    <article class="book issued-card">
      <div class="issued-row">
        <div>
          <h3>${escapeHTML(book.title)}</h3>
          <p class="author">by ${escapeHTML(book.author)}</p>
          <span class="borrower">👤 ${escapeHTML(borrower.name)}</span>
        </div>

        <button class="action return"
          onclick="returnBook(${book.id}, ${index})">
          ↙ &nbsp;Return
        </button>
      </div>
    </article>
  `;
}

function render() {
  if (view === "add") {
    content.innerHTML = `
      <h2>Add a Book</h2>

      <form class="panel" id="addForm">
        <h3>Book details</h3>

        <div class="form-grid">
          <div class="field full">
            <label for="title">Book title</label>
            <input id="title" name="title"
              required placeholder="Enter book title">
          </div>

          <div class="field full">
            <label for="author">Author</label>
            <input id="author" name="author"
              required placeholder="Enter author's name">
          </div>

          <div class="field">
            <label for="total">Number of copies</label>
            <input id="total" name="total"
              type="number" min="1" value="1" required>
          </div>
        </div>

        <button class="submit" type="submit">＋ Add Book</button>
      </form>
    `;

    document.getElementById("addForm").addEventListener("submit", event => {
      event.preventDefault();

      const form = new FormData(event.currentTarget);
      const title = form.get("title").trim();
      const author = form.get("author").trim();
      const total = Number(form.get("total"));

      if (!title || !author || !Number.isInteger(total) || total < 1) {
        showToast("Please enter valid book details.");
        return;
      }

      books.push({
        id: Date.now(),
        title,
        author,
        total,
        issued: []
      });

      saveBooks();
      view = "all";
      updateNavigation();
      render();
      showToast("Book added successfully!");
    });

    return;
  }

  if (view === "search") {
    content.innerHTML = `
      <h2>Search Books</h2>
      <div class="search-box">
        <input id="searchInput" type="search"
          placeholder="Search by title or author..."
          aria-label="Search books">
      </div>
      <div id="results" class="book-list"></div>
    `;

    const input = document.getElementById("searchInput");
    input.value = searchQuery;

    input.addEventListener("input", event => {
      searchQuery = event.target.value;
      renderSearchResults();
    });

    renderSearchResults();
    return;
  }

  if (view === "issued") {
    const issued = books.flatMap(book =>
      book.issued.map((person, index) => ({
        book,
        person,
        index
      }))
    );

    content.innerHTML = `
      <h2>Issued Books (${issued.length})</h2>
      <div class="book-list">
        ${issued.length
          ? issued.map(item =>
              issuedCard(item.book, item.person, item.index)
            ).join("")
          : '<div class="empty">No books are currently issued.</div>'}
      </div>
    `;

    return;
  }

  content.innerHTML = `
    <h2>All Books (${books.length})</h2>
    <div class="book-list">
      ${books.length
        ? books.map(bookCard).join("")
        : '<div class="empty">Your library is empty. Add your first book!</div>'}
    </div>
  `;
}

function updateNavigation() {
  document.querySelectorAll("nav button").forEach(button => {
    button.classList.toggle("active", button.dataset.view === view);
  });
}

function renderSearchResults() {
  const results = document.getElementById("results");
  if (!results) return;

  const query = searchQuery.toLowerCase().trim();

  const matches = books.filter(book =>
    book.title.toLowerCase().includes(query) ||
    book.author.toLowerCase().includes(query)
  );

  results.innerHTML = matches.length
    ? matches.map(bookCard).join("")
    : '<div class="empty">No matching books found.</div>';
}

function issueBook(id) {
  const book = books.find(item => item.id === id);
  if (!book || book.issued.length >= book.total) return;

  const name = prompt(
    `Who is borrowing "${book.title}"?`,
    ""
  );

  if (name === null) return;

  if (!name.trim()) {
    showToast("Please enter the borrower's name.");
    return;
  }

  book.issued.push({
    name: name.trim(),
    date: new Date().toISOString().slice(0, 10)
  });

  saveBooks();
  render();
  showToast("Book issued successfully!");
}

function returnBook(id, index) {
  const book = books.find(item => item.id === id);

  if (!book || book.issued.length === 0) return;

  if (typeof index === "number") {
    book.issued.splice(index, 1);
  } else {
    book.issued.shift();
  }

  saveBooks();
  render();
  showToast("Book returned successfully!");
}

function deleteBook(id) {
  const book = books.find(item => item.id === id);
  if (!book) return;

  if (!confirm(`Delete "${book.title}" from your library?`)) {
    return;
  }

  books = books.filter(item => item.id !== id);

  saveBooks();
  render();
  showToast("Book deleted successfully!");
}

render();
</script>

</body>
</html>
